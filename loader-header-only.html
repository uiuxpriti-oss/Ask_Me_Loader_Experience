<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask Me — Loader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --slate-800:#1E293B; --slate-600:#475569; --slate-500:#64748B; --slate-400:#94A3B8;
    --slate-300:#CBD5E1; --slate-200:#E2E8F0; --slate-100:#F1F5F9; --blue:#2563EB;
    --ease:cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#fff;font-family:'Inter',system-ui,sans-serif;color:var(--slate-800);-webkit-font-smoothing:antialiased}
  a{color:var(--slate-600)} a:hover{color:var(--slate-800)}
  .wrap{max-width:720px;margin:40px auto;padding:0 24px}

  /* header */
  .ld-head{display:flex;align-items:center;gap:12px;padding:8px 0;cursor:pointer;user-select:none;background:none;border:0;width:100%;text-align:left;font:inherit;color:inherit}
  .ld-glyph{position:relative;width:18px;height:18px;flex:none}
  .ld-label{font-size:14px;font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ld-label.run{background:linear-gradient(90deg,var(--slate-400) 0%,var(--slate-800) 45%,var(--slate-400) 90%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 2.6s linear infinite}
  .ld-label.done{font-weight:600;color:var(--slate-800)}
  .ld-time{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--slate-600);background:var(--slate-100);border-radius:6px;padding:2px 7px;flex:none}
  .ld-chev{flex:none;transition:transform .3s var(--ease)}
  .ld-head[aria-expanded="true"] .ld-chev{transform:rotate(180deg)}

  /* animated glyph set — crossfade */
  .g{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;animation:cyc 9s var(--ease) infinite}
  .g:nth-child(2){animation-delay:3s} .g:nth-child(3){animation-delay:6s}
  .bars{gap:2px;align-items:flex-end;height:14px}
  .bars i{display:block;width:3px;height:14px;border-radius:1.5px;background:var(--blue);transform-origin:bottom;animation:bar 1.8s var(--ease) infinite}
  .bars i:nth-child(2){opacity:.7;animation-delay:.2s} .bars i:nth-child(3){opacity:.45;animation-delay:.4s} .bars i:nth-child(4){opacity:.3;animation-delay:.6s}
  .lines{flex-direction:column;gap:2.5px;align-items:flex-start;width:14px}
  .lines i{display:block;height:2.5px;width:14px;border-radius:2px;background:var(--blue);transform-origin:left;animation:lnw 2.4s var(--ease) infinite}
  .lines i:nth-child(2){opacity:.65;animation-delay:.3s} .lines i:nth-child(3){opacity:.4;animation-delay:.6s}
  .dots{display:grid;grid-template-columns:repeat(3,3.5px);gap:2px;inset:auto;top:50%;left:50%;transform:translate(-50%,-50%)}
  .dots i{display:block;width:3.5px;height:3.5px;border-radius:50%;background:var(--blue);animation:dot 2.2s ease-in-out infinite}
  .dots i:nth-child(2),.dots i:nth-child(4){animation-delay:.25s} .dots i:nth-child(3),.dots i:nth-child(5),.dots i:nth-child(7){animation-delay:.5s}
  .dots i:nth-child(6),.dots i:nth-child(8){animation-delay:.75s} .dots i:nth-child(9){animation-delay:1s}
  .ld.is-done .g{display:none}
  .ok{display:none;position:absolute;inset:0;align-items:center;justify-content:center}
  .ld.is-done .ok{display:flex}

  /* steps */
  .ld-steps{overflow:hidden;display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s var(--ease)}
  .ld.open .ld-steps{grid-template-rows:1fr}
  .ld-steps>div{min-height:0;padding-left:30px}
  .step{display:flex;align-items:center;gap:9px;padding:6px 0;animation:fadeup .26s ease}
  .step-ic{width:14px;height:14px;display:flex;align-items:center;justify-content:center;flex:none}
  .step-t{font-size:14px;color:var(--slate-600)}
  .step.active .step-t{font-weight:500;background:linear-gradient(90deg,var(--slate-400) 0%,var(--slate-800) 45%,var(--slate-400) 90%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 2.6s linear infinite}
  .pulse{width:6px;height:6px;border-radius:50%;background:var(--slate-400);animation:pulse 1.6s ease infinite}

  .ctrl{display:flex;gap:8px;margin-top:24px}
  .btn{font:500 12px 'Inter',sans-serif;color:var(--slate-600);background:#fff;border:1px solid var(--slate-300);border-radius:8px;padding:6px 12px;cursor:pointer}
  .btn:hover{background:#F8FAFC;border-color:var(--slate-400)}

  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
  @keyframes cyc{0%{opacity:0;transform:scale(.9)}5%{opacity:1;transform:scale(1)}28%{opacity:1;transform:scale(1)}34%{opacity:0;transform:scale(1.06)}100%{opacity:0}}
  @keyframes bar{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
  @keyframes lnw{0%,100%{transform:scaleX(.45)}50%{transform:scaleX(1)}}
  @keyframes dot{0%,100%{opacity:.18}50%{opacity:1}}
  @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
  @keyframes fadeup{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="ld" id="ld">
    <button class="ld-head" id="head" aria-expanded="false" aria-controls="steps">
      <span class="ld-glyph" aria-hidden="true">
        <span class="g bars"><i></i><i></i><i></i><i></i></span>
        <span class="g lines"><i></i><i></i><i></i></span>
        <span class="g dots"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
        <span class="ok"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M3.5 8.5l3 3 6-7" stroke="#64748B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </span>
      <span class="ld-label run" id="label" role="status" aria-live="polite">Understanding your request…</span>
      <span class="ld-time" id="time">0:00</span>
      <svg class="ld-chev" width="14" height="14" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5L6 8l3.5-3.5" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="ld-steps" id="steps"><div id="list"></div></div>
  </div>

  <div class="ctrl">
    <button class="btn" id="replay">↻ Replay</button>
  </div>
</div>

<script>
(function(){
  // Phases: [running label, completed label, seconds]
  const PHASES = [
    ['Understanding your request', 'Understood your request', 3],
    ['Running data queries',       'Ran data queries',        5],
    ['Charting the results',       'Charted the results',     4],
    ['Generating insights',        'Generated insights',      3]
  ];
  const TOTAL = PHASES.reduce((s,p)=>s+p[2],0);
  const $ = id => document.getElementById(id);
  const ld=$('ld'), head=$('head'), label=$('label'), time=$('time'), list=$('list');
  const CHECK = '<svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M3.5 8.5l3 3 6-7" stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  let t0 = performance.now(), raf, lastIdx = -1;

  const fmt = s => Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0');
  function idxAt(t){ let acc=0; for(let i=0;i<PHASES.length;i++){ acc+=PHASES[i][2]; if(t<acc) return i; } return PHASES.length; }

  function renderList(idx){
    list.innerHTML = PHASES.slice(0, Math.min(idx+1, PHASES.length)).map((p,i)=>{
      const done = i < idx;
      return '<div class="step '+(done?'done':'active')+'"><span class="step-ic">'+(done?CHECK:'<span class="pulse"></span>')+'</span><span class="step-t">'+(done?p[1]:p[0]+'…')+'</span></div>';
    }).join('');
  }

  function frame(now){
    const t = (now - t0)/1000;
    const idx = idxAt(t);
    time.textContent = fmt(Math.min(t, TOTAL));
    if(idx !== lastIdx){
      lastIdx = idx;
      if(idx >= PHASES.length){
        ld.classList.add('is-done');
        label.className = 'ld-label done';
        label.textContent = 'Analysis complete in ' + TOTAL + 's';
      } else {
        label.textContent = PHASES[idx][0] + '…';
      }
      renderList(idx);
    }
    if(idx < PHASES.length) raf = requestAnimationFrame(frame);
  }

  head.addEventListener('click', ()=>{
    const open = !ld.classList.contains('open');
    ld.classList.toggle('open', open);
    head.setAttribute('aria-expanded', open);
  });
  $('replay').addEventListener('click', ()=>{
    cancelAnimationFrame(raf);
    ld.classList.remove('is-done');
    label.className = 'ld-label run';
    lastIdx = -1; t0 = performance.now();
    raf = requestAnimationFrame(frame);
  });

  raf = requestAnimationFrame(frame);
})();
</script>
</body>
</html>
